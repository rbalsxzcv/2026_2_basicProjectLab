<!doctype html>
<!--
  파일: public/index.html
  역할: 앱의 유일한 HTML 파일(메인 인터페이스). 화면 전환은 <main id="page"> 안쪽만 바뀝니다.
  주의: 아래 id(app, app-header, page, app-nav, modal-root, toast-root, loading-root)는
        다른 JS 파일이 찾아 쓰므로 이름을 바꾸지 마세요.
        페이지별 CSS는 라우터가 자동으로 붙이므로 여기에 추가하지 않습니다.
  담당: C1
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5BA672" />
    <title>AI 반려식물 코치</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header id="app-header"></header>      <!-- filled by layout.js -->
      <main id="page" tabindex="-1">         <!-- router draws pages -->
        <div class="boot center stack">
          <div class="spinner" aria-hidden="true"></div>
          <p class="muted">식물 친구를 깨우는 중이에요…</p>
        </div>
      </main>
      <nav id="app-nav" aria-label="주요 메뉴"></nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="loading-root"></div>
    <noscript>이 앱은 자바스크립트가 필요해요.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
